<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Showcase</title>
  <style>
    /* CSS Styles */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.2);
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #4f46e5;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Create Something Iconic</h1>
    <p class="subtitle">HTML, CSS, JS 기반의 모던 웹 UI 라이브 템플릿입니다.</p>

    <div class="card-grid">
      <div class="card">
        <h3>⚡ Fast Performance</h3>
        <p>경량화된 코드로 빠르게 로딩되는 사용자 경험을 제공합니다.</p>
      </div>
      <div class="card">
        <h3>🎨 Modern Design</h3>
        <p>다크 모드 감성과 깔끔한 그라데이션 트렌드를 반영했습니다.</p>
      </div>
      <div class="card">
        <h3>📱 Responsive</h3>
        <p>모바일과 데스크톱 등 다양한 디바이스 환경에 유연하게 대응합니다.</p>
      </div>
    </div>

    <button class="btn" id="actionBtn">시작하기</button>
  </div>

  <script>
    // JavaScript Logic
    document.getElementById('actionBtn').addEventListener('click', () => {
      alert('환영합니다! 트렌디한 웹페이지 구축을 시작해 보세요.');
    });
  </script>

</body>
</html>
